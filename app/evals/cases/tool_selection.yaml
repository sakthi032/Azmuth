# Tool-selection cases — the model must pick the right tool, not the
# nearest one. Each case asserts both "tool was called" and "the wrong
# tool was NOT called".

- id: tool_selection_weather_basic
  category: tool_selection
  input: "what's the weather in Chennai?"
  stub_responses:
    - tool_calls:
        - name: get_weather
          arguments: {city: "Chennai"}
    - content: "It's 29°C in Chennai with patchy rain."
  expected_tools: [get_weather]
  forbidden_tools: [search_web, get_gold_rate]

- id: tool_selection_gold_basic
  category: tool_selection
  input: "what is the gold rate today?"
  stub_responses:
    - tool_calls:
        - name: get_gold_rate
          arguments: {}
    - content: "Gold is ₹7,200 per gram in Chennai today."
  expected_tools: [get_gold_rate]
  forbidden_tools: [search_web, get_weather]

- id: tool_selection_search_overrides_dedicated_gold
  category: tool_selection
  input: "search the web for gold price news"
  stub_responses:
    - tool_calls:
        - name: search_web
          arguments: {query: "gold price news"}
    - content: "Here's the latest gold price news…"
  expected_tools: [search_web]
  forbidden_tools: [get_gold_rate]

- id: tool_selection_search_overrides_dedicated_weather

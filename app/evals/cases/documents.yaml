# Document cases — txt, csv, pdf, docx, xlsx; citation format; prompt injection
# defense; sandbox path enforcement; anonymous denial.

- id: documents_read_txt
  category: documents
  input: "read my notes.txt file"
  stub_responses:
    - tool_calls:
        - name: read_document
          arguments: {path: "notes.txt"}
    - content: "Summary of notes.txt (source: notes.txt, p.1): Action items for Q4."
  expected_tools: [read_document]
  forbidden_tools: [search_web, run_python]
  checks:
    - type: response_has_citation


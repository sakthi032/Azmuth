# Reminder cases — English, Tamil, and Tanglish time parsing, missing message,
# recurring tasks, cancel/list, and no duplicate/stale message reuse.

- id: reminder_english_in_2_hours
  category: reminders
  input: "remind me in 2 hours to call the dentist"
  stub_responses:
    - tool_calls:
        - name: schedule_reminder
          arguments: {message: "call the dentist", when_text: "in 2 hours"}
    - content: "Reminder set: call the dentist in 2 hours."
  expected_tools: [schedule_reminder]
  forbidden_tools: [search_web, run_python]
  checks:
    - type: response_matches
      pattern: "(call the dentist|2 hours|reminder set)"

- id: reminder_english_in_10_minutes
  category: reminders
  input: "set a reminder in 10 minutes to stretch"
  stub_responses:
    - tool_calls:
        - name: schedule_reminder
          arguments: {message: "stretch", when_text: "in 10 minutes"}
    - content: "I'll remind you to stretch in 10 minutes."
  expected_tools: [schedule_reminder]
  forbidden_tools: [add_note, add_todo]
  checks:
    - type: response_matches
      pattern: "stretch"

